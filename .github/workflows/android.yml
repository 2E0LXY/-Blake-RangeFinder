name: Android Build, Verify and Beta Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Run unit tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Build Android test APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK signature and alignment
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          "$SDK/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$SDK/build-tools/35.0.0/zipalign" -c -p 4 "$APK"
          "$SDK/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E 'package:|sdkVersion|targetSdkVersion'
          cp "$APK" Blake-RangeFinder-Pro-2.4.2-beta.2-DEBUG.apk
          sha256sum Blake-RangeFinder-Pro-2.4.2-beta.2-DEBUG.apk > SHA256SUMS

      - name: Upload validated APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Blake-RangeFinder-Pro-Android-beta
          path: |
            Blake-RangeFinder-Pro-2.4.2-beta.2-DEBUG.apk
            SHA256SUMS
          if-no-files-found: error

      - name: Publish GitHub prerelease after successful main build
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v2.4.2-beta.2"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; preserving its immutable APK assets."
          else
            gh release create "$TAG" Blake-RangeFinder-Pro-2.4.2-beta.2-DEBUG.apk SHA256SUMS \
              --title "Blake RangeFinder Pro 2.4.2 beta (Android)" \
              --notes "Debug-signed hardware-test beta. Built from native Android source and validated using apksigner and zipalign. FNIRSI IR40 live Bluetooth interoperability remains unverified. Keep the original app installed. Debug signing keys may differ between builds; install a stable release signing key before production deployment." \
              --prerelease \
              --target "$GITHUB_SHA"
          fi
